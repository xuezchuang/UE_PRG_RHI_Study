<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>UE 源码研究笔记</title>
<style>
/* ============================================================
   UE 源码研究笔记 · 单文件静态博客
   无框架 / 无依赖 / file:// 直接打开
   ============================================================ */
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Cascadia Code", Consolas, "JetBrains Mono", Menlo, monospace;

  --bg: #0c0e13;
  --bg-soft: #11141b;
  --card: #141924;
  --card-hover: #171d2a;
  --border: #222938;
  --border-2: #303a4d;
  --text: #d7deea;
  --text-2: #93a0b4;
  --text-3: #67728a;
  --accent: #6fb1ff;
  --accent-dim: rgba(111, 177, 255, .14);
  --accent-2: #59d6c0;
  --gold: #e5c07b;
  --code-bg: #1a2130;
  --flow-bg: #10141d;
  --shadow: 0 8px 28px rgba(0, 0, 0, .35);
  --head-bg: rgba(12, 14, 19, .78);
}
[data-theme="light"] {
  --bg: #f6f7fa;
  --bg-soft: #ffffff;
  --card: #ffffff;
  --card-hover: #ffffff;
  --border: #e5e8ef;
  --border-2: #ccd3df;
  --text: #252c38;
  --text-2: #5a6577;
  --text-3: #8a93a5;
  --accent: #0a6cff;
  --accent-dim: rgba(10, 108, 255, .10);
  --accent-2: #0e9488;
  --gold: #a8752c;
  --code-bg: #f0f3f8;
  --flow-bg: #f3f5f9;
  --shadow: 0 8px 24px rgba(25, 35, 60, .10);
  --head-bg: rgba(246, 247, 250, .82);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 15.5px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent-dim); }
a { color: inherit; text-decoration: none; }
code {
  font-family: var(--font-mono);
  font-size: .86em;
  background: var(--code-bg);
  border: 1px solid var(--border);
  padding: 1px 6px;
  border-radius: 5px;
  color: var(--accent-2);
  word-break: break-all;
}

/* ---------- 顶部进度条 ---------- */
#progress {
  position: fixed; top: 0; left: 0; height: 2px; width: 0;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  z-index: 99; transition: width .1s linear;
}

/* ---------- 头部 ---------- */
.site-head {
  position: sticky; top: 0; z-index: 90;
  background: var(--head-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.head-inner {
  max-width: 1880px; margin: 0 auto; padding: 0 32px;
  height: 60px; display: flex; align-items: center; justify-content: space-between;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; font-size: 16.5px; letter-spacing: .3px;
}
.brand .mark {
  width: 26px; height: 26px; border-radius: 7px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: grid; place-items: center;
  color: #fff; font-size: 13px; font-weight: 800; font-family: var(--font-mono);
}
.brand b { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.head-right { display: flex; align-items: center; gap: 14px; }
.head-ver {
  font-family: var(--font-mono); font-size: 12px; color: var(--text-3);
  border: 1px solid var(--border); padding: 2px 10px; border-radius: 20px;
}
#themeBtn {
  width: 34px; height: 34px; border-radius: 9px; cursor: pointer;
  background: var(--card); color: var(--text-2);
  border: 1px solid var(--border); font-size: 15px; line-height: 1;
  transition: all .18s;
}
#themeBtn:hover { color: var(--accent); border-color: var(--border-2); transform: translateY(-1px); }

/* ---------- 布局容器 ---------- */
.container { max-width: 1880px; margin: 0 auto; padding: 0 32px; }

/* ---------- 左侧文章导航 ---------- */
.shell { max-width: 1880px; margin: 0 auto; padding: 0 32px; }
.site-nav { display: none; }
@media (min-width: 1180px) {
  .shell { display: grid; grid-template-columns: 235px minmax(0, 1fr); gap: 44px; }
  .site-nav {
    display: block; position: sticky; top: 86px; align-self: start;
    max-height: calc(100vh - 110px); overflow-y: auto; padding: 12px 0 20px;
  }
}
.site-nav::-webkit-scrollbar { width: 6px; }
.site-nav::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }
.nav-home, .nav-item {
  display: block; padding: 9px 13px; border-radius: 10px; margin-bottom: 3px;
  color: var(--text-2); font-size: 13.5px; line-height: 1.5;
  transition: background .15s, color .15s; border: 1px solid transparent;
}
.nav-home { font-weight: 600; }
.nav-home:hover, .nav-item:hover { color: var(--accent); background: var(--card); }
.nav-home.on, .nav-item.on { color: var(--accent); background: var(--accent-dim); border-color: var(--accent); }
.nav-item .nav-date { display: block; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); margin-bottom: 1px; }
.nav-item.on .nav-date { color: var(--accent); opacity: .75; }
.nav-label {
  font-size: 11px; color: var(--text-3); letter-spacing: 2.5px;
  margin: 16px 4px 7px; padding-bottom: 7px; border-bottom: 1px solid var(--border);
}
#app { min-height: 70vh; }
.view { animation: rise .32s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- 首页 Hero ---------- */
.hero { padding: 64px 0 8px; }
.hero h1 {
  margin: 0 0 14px; font-size: 38px; line-height: 1.25; letter-spacing: .5px;
  background: linear-gradient(92deg, var(--text) 20%, var(--accent) 75%, var(--accent-2));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.hero .tagline { color: var(--text-2); font-size: 16px; max-width: 720px; margin: 0 0 22px; }
.hero .tagline code { font-size: .82em; }
.stats { display: flex; gap: 26px; flex-wrap: wrap; margin-bottom: 34px; }
.stat { display: flex; align-items: baseline; gap: 8px; }
.stat b { font-size: 22px; font-family: var(--font-mono); color: var(--accent); font-weight: 700; }
.stat span { color: var(--text-3); font-size: 13px; }

/* ---------- 搜索 / 标签 ---------- */
.toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
#q {
  flex: 1 1 280px; max-width: 420px;
  background: var(--card); border: 1px solid var(--border); color: var(--text);
  padding: 9px 16px; border-radius: 10px; font-size: 14px; font-family: inherit;
  outline: none; transition: border-color .18s, box-shadow .18s;
}
#q:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
#q::placeholder { color: var(--text-3); }
.tagbar { display: flex; gap: 8px; flex-wrap: wrap; }
.tag-chip {
  font-size: 12.5px; padding: 4px 13px; border-radius: 20px; cursor: pointer;
  background: transparent; border: 1px solid var(--border); color: var(--text-2);
  font-family: var(--font-mono); transition: all .15s; user-select: none;
}
.tag-chip:hover { border-color: var(--accent); color: var(--accent); }
.tag-chip.on { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

/* ---------- 文章卡片 ---------- */
.section-label {
  display: flex; align-items: center; gap: 12px;
  color: var(--text-3); font-size: 13px; letter-spacing: 2.5px; margin: 34px 0 6px;
}
.section-label::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.post-list { display: flex; flex-direction: column; gap: 18px; padding-bottom: 10px; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 24px 28px 20px; position: relative; overflow: hidden;
  transition: border-color .2s, transform .2s, box-shadow .2s;
}
.card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: linear-gradient(180deg, var(--accent), var(--accent-2));
  opacity: 0; transition: opacity .2s;
}
.card:hover { border-color: var(--border-2); transform: translateY(-2px); box-shadow: var(--shadow); }
.card:hover::before { opacity: 1; }
.card-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
.card-meta time { font-family: var(--font-mono); font-size: 12.5px; color: var(--text-3); }
.card-tags { display: flex; gap: 7px; flex-wrap: wrap; }
.pill {
  font-size: 11.5px; font-family: var(--font-mono); padding: 2px 10px; border-radius: 20px;
  background: var(--accent-dim); color: var(--accent);
}
.card-title { margin: 2px 0 10px; font-size: 21px; line-height: 1.4; }
.card-title a { transition: color .15s; }
.card:hover .card-title a { color: var(--accent); }
.card-ex { color: var(--text-2); font-size: 14.5px; margin: 0 0 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-foot {
  display: flex; justify-content: space-between; align-items: center;
  border-top: 1px dashed var(--border); padding-top: 12px;
  color: var(--text-3); font-size: 13px;
}
.card-foot .go { color: var(--accent); font-size: 13.5px; font-weight: 600; }
.empty { text-align: center; color: var(--text-3); padding: 48px 0; }

/* ---------- 关于 ---------- */
.about {
  margin: 40px 0 30px; background: var(--bg-soft);
  border: 1px solid var(--border); border-radius: 14px; padding: 24px 28px;
}
.about h2 { margin: 0 0 10px; font-size: 16px; color: var(--text); }
.about ul { margin: 0; padding-left: 20px; color: var(--text-2); font-size: 14px; }
.about li { margin: 5px 0; }

/* ---------- 文章页 ---------- */
.post-wrap { display: block; padding: 44px 0 10px; }
@media (min-width: 1380px) {
  .post-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 44px; }
  .post-wrap .toc-aside { display: block; }
  .toc-details { display: none !important; }
}
.crumb { font-size: 13.5px; color: var(--text-3); margin-bottom: 26px; display: inline-flex; align-items: center; gap: 6px; transition: color .15s; }
.crumb:hover { color: var(--accent); }
article.post { max-width: none; min-width: 0; }
article.post h1 {
  font-size: 30px; line-height: 1.4; margin: 0 0 14px; letter-spacing: .3px;
}
.post-meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
.post-meta time { font-family: var(--font-mono); font-size: 13px; color: var(--text-3); }
.post-lead { color: var(--text-2); font-size: 15px; border-left: 3px solid var(--accent); padding: 2px 0 2px 16px; margin: 18px 0 26px; }
.post-lead code { font-size: .85em; }

/* ---------- 流程总览块 ---------- */
.flow {
  background: var(--flow-bg); border: 1px solid var(--border); border-radius: 12px;
  margin: 26px 0 34px; overflow: hidden;
}
.flow-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 18px; border-bottom: 1px solid var(--border);
  background: var(--card); font-size: 12.5px; color: var(--text-3); letter-spacing: 1.5px;
}
.flow-head .legend { display: flex; gap: 14px; letter-spacing: 0; font-size: 12px; }
.flow-head .legend i { font-style: normal; }
.flow pre {
  margin: 0; padding: 20px 22px; overflow-x: auto;
  font-family: var(--font-mono); font-size: 12.8px; line-height: 1.85;
  color: var(--text); white-space: pre;
}
.flow .gt { color: #7fd18a; } [data-theme="light"] .flow .gt { color: #337a3c; }
.flow .tg { color: #c8a2e8; } [data-theme="light"] .flow .tg { color: #7d4fb0; }
.flow .rt { color: #66d3c8; } [data-theme="light"] .flow .rt { color: #0e8d7f; }
.flow .dim { color: var(--text-3); }

/* ---------- 章节 ---------- */
.grp { margin: 38px 0; scroll-margin-top: 86px; }
.grp h2 {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  font-size: 19.5px; margin: 0 0 12px; padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.grp h2 .idx {
  font-family: var(--font-mono); font-size: 13px; color: var(--accent);
  border: 1px solid var(--accent); border-radius: 7px; padding: 1px 8px; font-weight: 600;
}
.grp h2 .cnt { font-size: 12.5px; color: var(--text-3); font-weight: 400; font-family: var(--font-mono); margin-left: auto; }
.threadtag {
  display: inline-block; padding: 1px 10px; border-radius: 20px;
  font-size: 11.5px; font-weight: 600; letter-spacing: .5px;
}
.t-game   { background: rgba(90, 190, 110, .14); color: #6fc47f; }
.t-graph  { background: rgba(180, 130, 235, .14); color: #b98ae0; }
.t-render { background: rgba(90, 200, 200, .14); color: #58c4c4; }
.t-logic  { background: rgba(230, 180, 100, .14); color: #d8a55f; }
[data-theme="light"] .t-game { color: #2c7a38; }
[data-theme="light"] .t-graph { color: #7d4fb0; }
[data-theme="light"] .t-render { color: #0e8d7f; }
[data-theme="light"] .t-logic { color: #a8702a; }

.keynote {
  background: var(--bg-soft); border: 1px solid var(--border); border-left: 3px solid var(--accent);
  border-radius: 0 10px 10px 0; padding: 12px 18px; margin: 0 0 16px;
  font-size: 14px; color: var(--text-2);
}

/* ---------- 书签表格 ---------- */
.tblwrap {
  border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  background: var(--card);
}
.tblwrap::-webkit-scrollbar, .flow pre::-webkit-scrollbar { height: 8px; }
.tblwrap::-webkit-scrollbar-thumb, .flow pre::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 4px; }
table { width: 100%; border-collapse: collapse; font-size: 13.8px; table-layout: fixed; }
th {
  text-align: left; color: var(--text-3); font-weight: 600; font-size: 11.5px;
  letter-spacing: 1.5px; padding: 10px 16px;
  border-bottom: 1px solid var(--border); background: var(--bg-soft);
}
td { padding: 11px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: none; }
tbody tr { transition: background .12s; }
tbody tr:hover td { background: var(--card-hover); }
col.c-sym { width: 22%; } col.c-loc { width: 30%; } col.c-note { width: 48%; }
td.sym { font-family: var(--font-mono); color: var(--gold); font-size: 12.8px; word-break: break-word; overflow-wrap: anywhere; }
td.loc { font-family: var(--font-mono); font-size: 12.3px; color: var(--text-2); }
td.loc .dir { display: block; font-size: 10.8px; color: var(--text-3); word-break: break-all; margin-bottom: 2px; }
td.loc b { color: var(--accent); font-weight: 600; }
td.loc .ln { color: var(--gold); }
td.note { color: var(--text); font-size: 13.5px; }
@media (max-width: 720px) {
  .tblwrap { overflow-x: auto; }
  table { table-layout: auto; min-width: 640px; }
}

/* ---------- 复制按钮 ---------- */
.cp {
  margin-left: 8px; padding: 1px 8px; font-size: 11px; line-height: 19px;
  background: transparent; color: var(--text-3); border: 1px solid var(--border);
  border-radius: 5px; cursor: pointer; font-family: var(--font-sans);
  transition: all .15s; vertical-align: 1px;
}
.cp:hover { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
.cp.ok { background: rgba(90, 190, 110, .15); color: #6fc47f; border-color: rgba(90, 190, 110, .5); }

/* ---------- 关联笔记 ---------- */
.notes { margin: 40px 0 10px; }
.notes h2 { font-size: 19px; margin: 0 0 6px; }
.notes ul { padding-left: 4px; margin: 0; list-style: none; }
.notes li {
  position: relative; padding: 8px 0 8px 22px; color: var(--text-2); font-size: 14.5px;
  border-bottom: 1px dashed var(--border);
}
.notes li::before { content: "◆"; position: absolute; left: 2px; top: 9px; font-size: 9px; color: var(--accent-2); }

/* ---------- 上一篇 / 下一篇 ---------- */
.post-nav {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 44px 0 10px;
}
.post-nav a {
  border: 1px solid var(--border); border-radius: 12px; padding: 15px 18px;
  background: var(--card); transition: border-color .18s, transform .18s;
}
.post-nav a:hover { border-color: var(--accent); transform: translateY(-2px); }
.post-nav .dir-label { font-size: 12px; color: var(--text-3); display: block; margin-bottom: 3px; }
.post-nav .t { font-size: 14.5px; font-weight: 600; color: var(--text); }
.post-nav a.next { text-align: right; }
.post-nav a.next .t { color: var(--accent); }
.post-nav a.prev .t { color: var(--accent); }
@media (max-width: 640px) { .post-nav { grid-template-columns: 1fr; } }

/* ---------- 目录 ---------- */
.toc-aside { display: none; }
.toc-aside .toc-box { position: sticky; top: 86px; }
.toc-aside .toc-title { font-size: 12px; color: var(--text-3); letter-spacing: 2px; margin-bottom: 10px; }
.toc-aside a {
  display: block; padding: 5px 0 5px 14px; font-size: 13.2px; color: var(--text-2);
  border-left: 2px solid var(--border); transition: all .15s; cursor: pointer;
}
.toc-aside a:hover { color: var(--accent); border-left-color: var(--accent); }
.toc-details { margin: 0 0 26px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); }
.toc-details summary { padding: 10px 16px; cursor: pointer; font-size: 14px; color: var(--text-2); user-select: none; }
.toc-details .toc-details-inner { padding: 2px 16px 12px; }
.toc-details a { display: block; padding: 5px 0; font-size: 13.5px; color: var(--text-2); cursor: pointer; }
.toc-details a:hover { color: var(--accent); }

/* ---------- 页脚 ---------- */
.site-foot {
  margin-top: 70px; border-top: 1px solid var(--border);
  padding: 26px 0 40px; text-align: center; color: var(--text-3); font-size: 12.8px;
}
.site-foot .dots { color: var(--border-2); margin: 0 8px; }
</style>
</head>

/* ============================================================
   渲染器
   ============================================================ */

function esc(s) { return String(s); }

function rowHtml(r) {
  var dir = r.d ? '<span class="dir">' + r.d + '</span>' : '';
  return '<tr>'
    + '<td class="sym">' + r.s + '</td>'
    + '<td class="loc">' + dir + '<b>' + r.f + '</b><span class="ln">:' + r.l + '</span>'
    + '<button class="cp" data-copy="' + r.a + ':' + r.l + '">复制</button></td>'
    + '<td class="note">' + r.n + '</td>'
    + '</tr>';
}

function sectionHtml(sec, i) {
  var rows = sec.rows.map(rowHtml).join('');
  var n = sec.rows.length;
  return '<section class="grp" id="sec-' + i + '">'
    + '<h2><span class="idx">' + String(i + 1).padStart(2, '0') + '</span>'
    + '<span class="threadtag ' + sec.chip[0] + '">' + sec.chip[1] + '</span>'
    + sec.name
    + '<span class="cnt">' + n + ' 条书签 · ' + sec.src + '</span></h2>'
    + '<div class="keynote">' + sec.keynote + '</div>'
    + '<div class="tblwrap"><table>'
    + '<colgroup><col class="c-sym"><col class="c-loc"><col class="c-note"></colgroup>'
    + '<thead><tr><th>书签</th><th>位置(文件:行)</th><th>角色</th></tr></thead>'
    + '<tbody>' + rows + '</tbody>'
    + '</table></div>'
    + '</section>';
}

function flowHtml(p) {
  return '<div class="flow">'
    + '<div class="flow-head"><span>' + p.flowHead + '</span>'
    + '<span class="legend"><i class="gt">■ 游戏线程</i><i class="tg">■ TaskGraph</i><i class="rt">■ 渲染线程</i></span></div>'
    + '<pre>' + p.flow + '</pre></div>';
}

function bookmarkCount(p) {
  return p.sections.reduce(function (a, s) { return a + s.rows.length; }, 0);
}

function postView(p) {
  var idx = POSTS.indexOf(p);
  var prev = POSTS[idx - 1], next = POSTS[idx + 1];
  var toc = p.sections.map(function (s, i) {
    return '<a data-scroll="sec-' + i + '">' + (i + 1) + ' · ' + s.name + '</a>';
  }).join('');

  var nav = '<div class="post-nav">'
    + (prev ? '<a class="prev" href="#/post/' + prev.id + '"><span class="dir-label">← 上一篇</span><span class="t">' + prev.title + '</span></a>' : '<span></span>')
    + (next ? '<a class="next" href="#/post/' + next.id + '"><span class="dir-label">下一篇 →</span><span class="t">' + next.title + '</span></a>' : '<span></span>')
    + '</div>';

  var tagPills = p.tags.map(function (t) { return '<span class="pill">' + t + '</span>'; }).join('');

  return '<div class="view post-wrap">'
    + '<div style="min-width:0;">'
    + '<a class="crumb" href="#/">← 全部文章</a>'
    + '<article class="post">'
    + '<h1>' + p.title + '</h1>'
    + '<div class="post-meta"><time>' + p.date + '</time><span class="card-tags">' + tagPills + '</span></div>'
    + '<p class="post-lead">' + p.lead + '</p>'
    + flowHtml(p)
    + '<details class="toc-details" open><summary>本页目录</summary><div class="toc-details-inner">' + toc + '</div></details>'
    + p.sections.map(sectionHtml).join('')
    + '<div class="notes"><h2>关联笔记</h2><ul>'
    + p.notes.map(function (x) { return '<li>' + x + '</li>'; }).join('')
    + '</ul></div>'
    + nav
    + '</article>'
    + '</div>'
    + '<aside class="toc-aside"><div class="toc-box"><div class="toc-title">本文目录</div>' + toc + '</div></aside>'
    + '</div>';
}

function cardHtml(p) {
  var tagPills = p.tags.map(function (t) { return '<span class="pill">' + t + '</span>'; }).join('');
  var secs = p.sections.length;
  return '<article class="card">'
    + '<div class="card-meta"><time>' + p.date + '</time><div class="card-tags">' + tagPills + '</div></div>'
    + '<h2 class="card-title"><a href="#/post/' + p.id + '">' + p.title + '</a></h2>'
    + '<p class="card-ex">' + p.excerpt + '</p>'
    + '<div class="card-foot"><span>' + bookmarkCount(p) + ' 条书签 · ' + secs + ' 个分组</span><span class="go">阅读全文 →</span></div>'
    + '</article>';
}

function allTags() {
  var seen = {};
  POSTS.forEach(function (p) { p.tags.forEach(function (t) { seen[t] = 1; }); });
  return Object.keys(seen);
}

var filterState = { q: '', tags: {} };

function filteredPosts() {
  return POSTS.filter(function (p) {
    var hay = (p.title + ' ' + p.excerpt + ' ' + p.tags.join(' ')).toLowerCase();
    if (filterState.q && hay.indexOf(filterState.q) === -1) return false;
    for (var t in filterState.tags) {
      if (filterState.tags[t] && p.tags.indexOf(t) === -1) return false;
    }
    return true;
  });
}

function homeView() {
  var total = POSTS.reduce(function (a, p) { return a + bookmarkCount(p); }, 0);
  var latest = POSTS.map(function (p) { return p.date; }).sort().reverse()[0];
  var chips = allTags().map(function (t) {
    return '<span class="tag-chip" data-tag="' + t + '">' + t + '</span>';
  }).join('');

  return '<div class="view">'
    + '<div class="hero">'
    + '<h1>UE 源码研究笔记</h1>'
    + '<p class="tagline">基于本地 UE 5.2.1 源检出(<code>D:\\UnrealEngine</code>)的调用链考古:每个调查主题是一篇文章,每行书签可一键复制绝对 <code>路径\\文件:行号</code>,粘贴到 VS 直接跳转。</p>'
    + '<div class="stats">'
    + '<div class="stat"><b>' + POSTS.length + '</b><span>篇文章</span></div>'
    + '<div class="stat"><b>' + total + '</b><span>条源码书签</span></div>'
    + '<div class="stat"><b>' + latest + '</b><span>最近更新</span></div>'
    + '</div>'
    + '<div class="toolbar"><input id="q" type="text" placeholder="搜索标题 / 摘要 / 标签…"><div class="tagbar" id="tagbar">' + chips + '</div></div>'
    + '</div>'
    + '<div class="section-label">文 章</div>'
    + '<div class="post-list" id="postList"></div>'
    + '<section class="about"><h2>关于 · 记录规则</h2><ul>'
    + '<li>本站是源码调查的长期记录:每条<b>已验证</b>的调用链 = 一篇文章;新调查追加新文章,不散落其他文件。</li>'
    + '<li>行格式固定:符号 + 可复制的绝对 <code>路径\\文件:行号</code>(VS Ctrl+G 友好)+ 角色注记(控制流 / 数据所有权 / 线程)。</li>'
    + '<li>明确区分"源码验证 / 推断 / 未验证运行时";调试栈行号与真实语句存在漂移时以验证结果为准。</li>'
    + '<li>纯静态单文件,无框架无依赖,双击即看;行号对应本地 UE 5.2.1 检出,引擎更新后以符号名为准重新定位。</li>'
    + '</ul></section>'
    + '</div>';
}

function renderList() {
  var list = document.getElementById('postList');
  if (!list) return;
  var posts = filteredPosts();
  list.innerHTML = posts.length
    ? posts.map(cardHtml).join('')
    : '<div class="empty">没有匹配的文章,换个关键词试试。</div>';
}

function bindHome() {
  filterState = { q: '', tags: {} };
  var q = document.getElementById('q');
  var bar = document.getElementById('tagbar');
  if (q) q.addEventListener('input', function () { filterState.q = q.value.trim().toLowerCase(); renderList(); });
  if (bar) bar.addEventListener('click', function (e) {
    var chip = e.target.closest('.tag-chip');
    if (!chip) return;
    var t = chip.getAttribute('data-tag');
    filterState.tags[t] = !filterState.tags[t];
    chip.classList.toggle('on', filterState.tags[t]);
    renderList();
  });
  renderList();
}

/* ---------- 路由 ---------- */

var LEGACY = {
  '#tab-render-command': '#/post/render-command-chain',
  '#tab-init-resource': '#/post/init-resource-chain'
};

function renderSiteNav() {
  var el = document.getElementById('siteNav');
  if (!el) return;
  var current = (location.hash.match(/^#\/post\/([\w-]+)/) || [])[1];
  var items = POSTS.map(function (p) {
    return '<a class="nav-item' + (p.id === current ? ' on' : '') + '" href="#/post/' + p.id + '">'
      + '<span class="nav-date">' + p.date + '</span>' + (p.navTitle || p.title) + '</a>';
  }).join('');
  el.innerHTML = '<a class="nav-home' + (current ? '' : ' on') + '" href="#/">☰ 全部文章</a>'
    + '<div class="nav-label">文 章 · ' + POSTS.length + '</div>' + items;
}

function route() {
  var h = location.hash || '#/';
  if (LEGACY[h]) { location.replace(LEGACY[h]); return; }
  renderSiteNav();

  var app = document.getElementById('app');
  var m = h.match(/^#\/post\/([\w-]+)/);
  var p = m && POSTS.filter(function (x) { return x.id === m[1]; })[0];

  if (p) {
    app.innerHTML = postView(p);
    window.scrollTo(0, 0);
  } else {
    app.innerHTML = homeView();
    bindHome();
  }
  updateProgress();
}

/* ---------- 交互 ---------- */

function updateProgress() {
  var el = document.getElementById('progress');
  var max = document.documentElement.scrollHeight - window.innerHeight;
  el.style.width = max > 0 ? (window.scrollY / max * 100) + '%' : '0%';
}
window.addEventListener('scroll', updateProgress, { passive: true });
window.addEventListener('resize', updateProgress);

document.addEventListener('click', function (e) {
  var jump = e.target.closest('[data-scroll]');
  if (jump) {
    var t = document.getElementById(jump.getAttribute('data-scroll'));
    if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  var btn = e.target.closest('button.cp');
  if (!btn) return;
  var text = btn.getAttribute('data-copy');
  function markOk() {
    btn.textContent = '已复制'; btn.classList.add('ok');
    setTimeout(function () { btn.textContent = '复制'; btn.classList.remove('ok'); }, 1200);
  }
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); markOk(); } catch (err) { btn.textContent = '失败'; }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(markOk, fallback);
  } else { fallback(); }
});

/* ---------- 主题 ---------- */

var themeBtn = document.getElementById('themeBtn');
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === 'dark' ? '☀' : '☾';
  themeBtn.title = t === 'dark' ? '切换到亮色' : '切换到暗色';
  try { localStorage.setItem('uer-theme', t); } catch (e) {}
}
themeBtn.addEventListener('click', function () {
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
});
try { var saved = localStorage.getItem('uer-theme'); applyTheme(saved || 'dark'); } catch (e) { applyTheme('dark'); }

/* ---------- 启动 ---------- */
window.addEventListener('hashchange', route);
route();
</script>
